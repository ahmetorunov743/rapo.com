<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог объявлений — Рекламная платформа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="masthead">
    <div class="masthead__inner">
      <a href="../index.html" class="masthead__mark">Рекламная платформа</a>
      <nav class="nav-links">
        <a href="profile.html">Профиль</a>
        <a href="listing-new.html" class="nav-cta">+ Разместить объявление</a>
        <button id="logout-btn" type="button">Выйти</button>
      </nav>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <div class="feed-toolbar">
        <div>
          <p class="eyebrow" style="margin-bottom:6px;">Каталог</p>
          <h1 style="font-size:1.7rem;margin:0;">Все объявления</h1>
        </div>
        <input type="search" id="search-input" placeholder="Поиск по заголовку или описанию">
      </div>

      <div id="ad-grid" class="ad-grid"></div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <h2>Объявлений пока нет</h2>
        <p>Будьте первым, кто разместит объявление в каталоге.</p>
        <a href="listing-new.html" class="btn btn--primary" style="margin-top:16px;">Разместить объявление</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Рекламная платформа · все объявления проходят через единый реестр</p>
  </footer>

  <script src="../data.js"></script>
  <script>
    DB.requireAuth('login.html');

    var grid = document.getElementById('ad-grid');
    var emptyState = document.getElementById('empty-state');
    var searchInput = document.getElementById('search-input');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function render(ads) {
      grid.innerHTML = '';
      emptyState.style.display = ads.length ? 'none' : 'block';
      ads.forEach(function (ad) {
        var card = document.createElement('a');
        card.className = 'ad-card';
        card.href = 'listing.html?id=' + encodeURIComponent(ad.id);
        card.innerHTML =
          '<span class="ad-card__meta">' + escapeHtml(ad.author || 'Автор скрыт') + '</span>' +
          '<h3 class="ad-card__title">' + escapeHtml(ad.title) + '</h3>' +
          '<p class="ad-card__desc">' + escapeHtml((ad.description || '').slice(0, 110)) + (ad.description && ad.description.length > 110 ? '…' : '') + '</p>' +
          (ad.price ? '<span class="ad-card__price">' + escapeHtml(ad.price) + '</span>' : '');
        grid.appendChild(card);
      });
    }

    function load(query) {
      DB.getAds({ query: query }).then(render);
    }

    load();

    var debounceTimer;
    searchInput.addEventListener('input', function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () { load(searchInput.value.trim()); }, 200);
    });

    document.getElementById('logout-btn').addEventListener('click', function () {
      DB.logout();
      window.location.href = '../index.html';
    });
  </script>

</body>
</html>
